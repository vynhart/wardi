<div
  class="export-wrapper"
  style="
    width: 375px;
    min-height: 812px;
    position: relative;
    font-family: var(--font-family-body);
    background-color: var(--background);
  "
>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&family=Geist:wght@100;200;300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@100;200;300;400;500;600;700&family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Nunito:wght@200;300;400;500;600;700;800;900&family=PT+Serif:wght@400;700&family=Roboto+Slab:wght@100;200;300;400;500;600;700;800;900&family=Roboto:wght@100;300;400;500;700;900&family=Shantell+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <html>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Mobile Catalog</title>
      <style id="global-styles">
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .export-wrapper {
          background-color: var(--muted);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 812px;
          font-family: var(--font-family-body, sans-serif);
          padding: 40px 0;
        }
      </style>
      <style id="mobile-container-styles">
        .mobile-wrapper {
          width: 100%;
          max-width: 375px;
          background-color: var(--background);
          min-height: 812px;
          border-radius: 34px;
          box-shadow: 0 16px 32px rgba(15, 23, 36, 0.08);
          display: flex;
          flex-direction: column;
          overflow: hidden;
          position: relative;
          border: 6px solid #ececec;
        }
        .header {
          padding: 22px 20px 18px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          background-color: var(--background);
          position: sticky;
          top: 0;
          z-index: 10;
        }
        .header-title {
          font-size: 18px;
          font-weight: 600;
          color: var(--foreground);
        }
        .header-actions {
          display: flex;
          gap: 8px;
          align-items: center;
        }
        .icon-button {
          width: 40px;
          height: 40px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: transparent;
          position: relative;
          flex-shrink: 0;
        }
        .cart-sheet {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: var(--card);
          border-top-left-radius: 24px;
          border-top-right-radius: 24px;
          box-shadow: 0 -8px 24px rgba(15, 23, 36, 0.06);
          padding: 12px 20px 18px;
          z-index: 20;
        }
        .sheet-handle {
          width: 36px;
          height: 4px;
          border-radius: 999px;
          background-color: #e5e7eb;
          margin: 0 auto 14px;
        }
        .cart-sheet-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
        }
        .cart-sheet-left {
          display: flex;
          flex-direction: column;
          gap: 4px;
          min-width: 0;
        }
        .cart-sheet-label {
          font-size: 13px;
          font-weight: 500;
          color: var(--muted-foreground);
          white-space: nowrap;
        }
        .cart-sheet-total {
          font-size: 20px;
          font-weight: 600;
          color: var(--foreground);
          white-space: nowrap;
        }
        .cart-sheet-meta {
          font-size: 13px;
          font-weight: 500;
          color: var(--foreground);
          white-space: nowrap;
        }
        .cart-sheet-cta {
          min-width: 136px;
          height: 44px;
          padding: 0 18px;
          border-radius: var(--radius-xl);
          background-color: var(--primary);
          color: var(--primary-foreground);
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          font-size: 15px;
          font-weight: 500;
          white-space: nowrap;
          flex-shrink: 0;
        }
        .cart-sheet-count {
          width: 22px;
          height: 22px;
          border-radius: 999px;
          background-color: rgba(255, 255, 255, 0.18);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
          font-weight: 600;
          color: var(--primary-foreground);
        }
      </style>
      <style id="catalog-styles">
        .content-area {
          flex: 1;
          padding: 20px 20px 168px;
          overflow-y: auto;
          background-color: var(--background);
        }
        .categories {
          display: flex;
          gap: 12px;
          margin-bottom: 20px;
          overflow-x: auto;
          padding-bottom: 8px;
          scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
          display: none;
        }
        .category-pill {
          padding: 10px 16px;
          border-radius: var(--radius-xl);
          background-color: var(--secondary);
          color: var(--secondary-foreground);
          font-size: 14px;
          font-weight: 500;
          white-space: nowrap;
        }
        .category-pill.active {
          background-color: var(--foreground);
          color: var(--background);
        }
        .product-list {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 18px 16px;
          padding-bottom: 8px;
        }
        .product-item {
          display: flex;
          flex-direction: column;
          gap: 10px;
          align-items: stretch;
          min-width: 0;
        }
        .product-image-wrapper {
          width: 100%;
          aspect-ratio: 4 / 5;
          border-radius: 10px;
          background-color: var(--secondary);
          overflow: hidden;
          position: relative;
        }
        .product-image {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .product-details {
          flex: 1;
          display: flex;
          flex-direction: column;
          min-width: 0;
        }
        .product-title {
          font-size: 14px;
          font-weight: 500;
          color: var(--foreground);
          line-height: 1.35;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          min-height: 38px;
        }
        .product-bottom {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 8px;
          gap: 8px;
        }
        .product-price {
          font-size: 15px;
          font-weight: 600;
          color: var(--foreground);
          white-space: nowrap;
        }
        .add-to-cart-btn {
          width: 32px;
          height: 32px;
          border-radius: 50%;
          background-color: var(--primary);
          color: var(--primary-foreground);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }
        .brand-footer {
          display: flex;
          justify-content: center;
          padding: 26px 0 8px;
        }
        .brand-footer-link {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-size: 13px;
          font-weight: 500;
          color: var(--muted-foreground);
          white-space: nowrap;
        }
        .brand-footer-name {
          color: var(--foreground);
          font-weight: 600;
        }
      </style>
    </head>
