<div
  class="export-wrapper"
  style="
    width: 375px;
    min-height: 812px;
    position: relative;
    font-family: var(--font-family-body);
    background-color: var(--background);
  "
>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&family=Geist:wght@100;200;300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@100;200;300;400;500;600;700&family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Nunito:wght@200;300;400;500;600;700;800;900&family=PT+Serif:wght@400;700&family=Roboto+Slab:wght@100;200;300;400;500;600;700;800;900&family=Roboto:wght@100;300;400;500;700;900&family=Shantell+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <html>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Products</title>
      <style id="global-styles">
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .export-wrapper {
          background-color: var(--muted);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 812px;
          font-family: var(--font-family-body, sans-serif);
          padding: 40px 0;
        }
      </style>
      <style id="mobile-container-styles">
        .mobile-wrapper {
          width: 100%;
          max-width: 375px;
          background-color: var(--background);
          min-height: 812px;
          border-radius: 40px;
          box-shadow:
            0 20px 40px rgba(0, 0, 0, 0.08),
            0 1px 3px rgba(0, 0, 0, 0.05);
          display: flex;
          flex-direction: column;
          overflow: hidden;
          position: relative;
          border: 8px solid var(--border);
        }
        .header {
          padding: 16px 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          background-color: var(--background);
          position: sticky;
          top: 0;
          z-index: 10;
        }
        .header-title {
          font-size: 20px;
          font-weight: 600;
          color: var(--foreground);
        }
        .icon-button {
          width: 40px;
          height: 40px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: transparent;
          margin-right: -8px;
        }
      </style>
      <style id="catalog-structural-styles">
        .top-controls {
          padding: 0 20px 16px;
          background-color: var(--background);
          border-bottom: 1px solid var(--border);
        }
        .search-bar {
          display: flex;
          align-items: center;
          background-color: var(--muted);
          padding: 12px 16px;
          border-radius: var(--radius-md);
          gap: 12px;
          color: var(--muted-foreground);
          font-size: 15px;
        }
        .categories-scroll {
          display: flex;
          gap: 12px;
          overflow-x: auto;
          margin-top: 16px;
          padding-bottom: 4px;
          scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar {
          display: none;
        }
        .category-pill {
          padding: 8px 16px;
          border-radius: var(--radius-xl);
          background-color: var(--muted);
          color: var(--foreground);
          font-size: 14px;
          font-weight: 500;
          white-space: nowrap;
        }
        .category-pill.active {
          background-color: var(--foreground);
          color: var(--background);
        }
      </style>
      <style id="empty-state-styles">
        .main-content {
          flex: 1;
          display: flex;
          flex-direction: column;
          background-color: var(--background);
        }
        .empty-state-wrapper {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 40px 32px;
          text-align: center;
        }
        .empty-icon-circle {
          width: 96px;
          height: 96px;
          border-radius: 50%;
          background-color: var(--muted);
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
        }
        .empty-title {
          font-size: 20px;
          font-weight: 600;
          color: var(--foreground);
          margin-bottom: 12px;
        }
        .empty-desc {
          font-size: 15px;
          color: var(--muted-foreground);
          margin-bottom: 32px;
          line-height: 1.5;
        }
        .btn-primary {
          background-color: var(--primary);
          color: var(--primary-foreground);
          padding: 16px 24px;
          border-radius: var(--radius-md);
          font-weight: 600;
          font-size: 15px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          width: 100%;
          max-width: 240px;
        }
      </style>
      <style id="bottom-nav-styles">
        .bottom-nav {
          display: flex;
          justify-content: space-around;
          align-items: center;
          padding: 12px 0 24px;
          background-color: var(--background);
          border-top: 1px solid var(--border);
        }
        .nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 4px;
          color: var(--muted-foreground);
          width: 64px;
        }
        .nav-item.active {
          color: var(--primary);
        }
        .nav-label {
          font-size: 11px;
          font-weight: 500;
        }
      </style>
    </head>
    <body>
      <div class="mobile-wrapper" id="product-management-screen">
        <!-- Header -->
        <header class="header">
          <div class="header-title">Products</div>
          <div class="icon-button" data-media-type="banani-button">
            <div
              style="
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <iconify-icon
                icon="lucide:bell"
                style="font-size: 24px; color: var(--foreground)"
              ></iconify-icon>
            </div>
          </div>
        </header>

        <!-- Structural mimicking of Catalog -->
        <div class="top-controls">
          <div class="search-bar" data-media-type="banani-button">
            <div
              style="
                width: 20px;
                height: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <iconify-icon
                icon="lucide:search"
                style="font-size: 20px; color: var(--muted-foreground)"
              ></iconify-icon>
            </div>
            <span>Search inventory...</span>
          </div>

          <div class="categories-scroll">
            <div class="category-pill active" data-media-type="banani-button">
              All Items
            </div>
            <div class="category-pill" data-media-type="banani-button">
              Published
            </div>
            <div class="category-pill" data-media-type="banani-button">
              Drafts
            </div>
            <div class="category-pill" data-media-type="banani-button">
              Out of Stock
            </div>
          </div>
        </div>

        <!-- Main Content / Empty State -->
        <main class="main-content">
          <div class="empty-state-wrapper">
            <div class="empty-icon-circle">
              <div
                style="
                  width: 48px;
                  height: 48px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <iconify-icon
                  icon="lucide:package-open"
                  style="font-size: 48px; color: var(--muted-foreground)"
                ></iconify-icon>
              </div>
            </div>
            <h2 class="empty-title">No products yet</h2>
            <p class="empty-desc">
              Start building your catalog by adding your first product to the
              store.
            </p>

            <div class="btn-primary" data-media-type="banani-button">
              <div
                style="
                  width: 20px;
                  height: 20px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <iconify-icon
                  icon="lucide:plus"
                  style="font-size: 20px; color: var(--primary-foreground)"
                ></iconify-icon>
              </div>
              Add First Product
            </div>
          </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
          <div class="nav-item" data-media-type="banani-button">
            <div
              style="
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <iconify-icon
                icon="lucide:layout-grid"
                style="font-size: 24px; color: inherit"
              ></iconify-icon>
            </div>
            <span class="nav-label">Dashboard</span>
          </div>
          <div class="nav-item" data-media-type="banani-button">
            <div
              style="
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <iconify-icon
                icon="lucide:inbox"
                style="font-size: 24px; color: inherit"
              ></iconify-icon>
            </div>
            <span class="nav-label">Orders</span>
          </div>
          <div class="nav-item active" data-media-type="banani-button">
            <div
              style="
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <iconify-icon
                icon="lucide:tag"
                style="font-size: 24px; color: inherit"
              ></iconify-icon>
            </div>
            <span class="nav-label">Products</span>
          </div>
          <div class="nav-item" data-media-type="banani-button">
            <div
              style="
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <iconify-icon
                icon="lucide:user"
                style="font-size: 24px; color: inherit"
              ></iconify-icon>
            </div>
            <span class="nav-label">Profile</span>
          </div>
        </nav>
      </div>
    </body>
  </html>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #0f1724;
      --border: #00000014;
      --input: #f8fafb;
      --primary: #0066ff;
      --primary-foreground: #ffffff;
      --secondary: #f1f6ff;
      --secondary-foreground: #0840a8;
      --muted: #f3f4f6;
      --muted-foreground: #94a3b8;
      --success: #22c55e;
      --success-foreground: #ffffff;
      --accent: #ffd166;
      --accent-foreground: #222222;
      --destructive: #ef4444;
      --destructive-foreground: #ffffff;
      --warning: #f59e0b;
      --warning-foreground: #111827;
      --card: #ffffff;
      --card-foreground: #0f1724;
      --sidebar: #f8fafb;
      --sidebar-foreground: #0b1220;
      --sidebar-primary: #e6f0ff;
      --sidebar-primary-foreground: #003eaa;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --font-family-body: Inter;
    }
  </style>
</div>
