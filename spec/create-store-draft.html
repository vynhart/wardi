<div
  class="export-wrapper"
  style="
    width: 375px;
    min-height: 812px;
    position: relative;
    font-family: var(--font-family-body);
    background-color: var(--background);
  "
>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&family=Geist:wght@100;200;300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@100;200;300;400;500;600;700&family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Nunito:wght@200;300;400;500;600;700;800;900&family=PT+Serif:wght@400;700&family=Roboto+Slab:wght@100;200;300;400;500;600;700;800;900&family=Roboto:wght@100;300;400;500;700;900&family=Shantell+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <html>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Create Store</title>
      <style id="global-styles">
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .export-wrapper {
          background-color: var(--muted);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 812px;
          font-family: var(--font-family-body, sans-serif);
          padding: 40px 0;
        }
      </style>
      <style id="mobile-container-styles">
        .mobile-wrapper {
          width: 100%;
          max-width: 375px;
          background-color: var(--background);
          min-height: 812px;
          border-radius: 34px;
          box-shadow: 0 16px 32px rgba(15, 23, 36, 0.08);
          display: flex;
          flex-direction: column;
          overflow: hidden;
          position: relative;
          border: 6px solid #ececec;
        }
        .header {
          padding: 22px 20px 18px;
          display: flex;
          justify-content: center;
          align-items: center;
          background-color: var(--background);
          position: sticky;
          top: 0;
          z-index: 10;
        }
        .header-title {
          font-size: 18px;
          font-weight: 600;
          color: var(--foreground);
        }
      </style>
      <style id="create-store-styles">
        .content-area {
          flex: 1;
          padding: 24px 20px 40px;
          overflow-y: auto;
          background-color: var(--background);
          display: flex;
          flex-direction: column;
        }
        .welcome-section {
          margin-bottom: 32px;
          text-align: center;
        }
        .welcome-title {
          font-size: 24px;
          font-weight: 700;
          color: var(--foreground);
          margin-bottom: 8px;
        }
        .welcome-subtitle {
          font-size: 15px;
          color: var(--muted-foreground);
          line-height: 1.5;
        }
        .form-group {
          display: flex;
          flex-direction: column;
          gap: 8px;
          margin-bottom: 24px;
        }
        .form-label {
          font-size: 14px;
          font-weight: 500;
          color: var(--foreground);
        }
        .form-input {
          height: 48px;
          border: 1px solid var(--border);
          border-radius: var(--radius-md);
          padding: 0 16px;
          font-size: 15px;
          color: var(--foreground);
          display: flex;
          align-items: center;
          background-color: var(--background);
        }
        .form-input.placeholder {
          color: var(--muted-foreground);
        }
        .form-textarea {
          min-height: 120px;
          border: 1px solid var(--border);
          border-radius: var(--radius-md);
          padding: 12px 16px;
          font-size: 15px;
          color: var(--foreground);
          background-color: var(--background);
          display: flex;
          align-items: flex-start;
        }
        .form-textarea.placeholder {
          color: var(--muted-foreground);
        }
        .bottom-actions {
          margin-top: auto;
          padding-top: 32px;
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .primary-cta {
          height: 48px;
          border-radius: var(--radius-xl);
          background-color: var(--primary);
          color: var(--primary-foreground);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 16px;
          font-weight: 600;
          width: 100%;
        }
        .brand-footer {
          display: flex;
          justify-content: center;
          padding: 24px 0 8px;
        }
        .brand-footer-link {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-size: 13px;
          font-weight: 500;
          color: var(--muted-foreground);
        }
        .brand-footer-name {
          color: var(--foreground);
          font-weight: 600;
        }
        .illustration-container {
          width: 100%;
          aspect-ratio: 16/9;
          border-radius: var(--radius-lg);
          overflow: hidden;
          margin-bottom: 24px;
          background-color: var(--secondary);
        }
        .illustration-image {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
      </style>
    </head>
    <body>
      <div class="mobile-wrapper" id="create-store-screen">
        <nav class="header" id="create-store-header">
          <div class="header-title">Setup</div>
        </nav>

        <main class="content-area" id="create-store-content">
          <div class="illustration-container">
            <img
              class="illustration-image"
              data-aspect-ratio="16:9"
              data-query="abstract minimalist illustration of a modern storefront, clean vectors, soft commerce palette, geometric shapes, warm tones"
              alt="Store Setup Illustration"
              src="https://storage.googleapis.com/banani-generated-images/generated-images/60c1490a-d50e-4931-8112-25ae2e4f1023.jpg"
            />
          </div>

          <div class="welcome-section">
            <h1 class="welcome-title">Create your store</h1>
            <p class="welcome-subtitle">
              Give your store a name and a short description to get started.
            </p>
          </div>

          <div class="form-group" id="store-name-group">
            <label class="form-label">Store Name</label>
            <div class="form-input placeholder" data-media-type="banani-button">
              e.g. My Awesome Boutique
            </div>
          </div>

          <div class="form-group" id="store-description-group">
            <label class="form-label"
              >Description
              <span style="color: var(--muted-foreground); font-weight: 400"
                >(Optional)</span
              ></label
            >
            <div
              class="form-textarea placeholder"
              data-media-type="banani-button"
            >
              Tell your customers what you sell...
            </div>
          </div>

          <div class="bottom-actions">
            <div
              class="primary-cta"
              data-media-type="banani-button"
              id="create-store-btn"
            >
              Create Store
            </div>

            <div class="brand-footer" id="brand-footer">
              <div class="brand-footer-link" data-media-type="banani-button">
                <span>Powered by</span>
                <span class="brand-footer-name">wardi</span>
              </div>
            </div>
          </div>
        </main>
      </div>
    </body>
  </html>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #0f1724;
      --border: #00000014;
      --input: #f8fafb;
      --primary: #0066ff;
      --primary-foreground: #ffffff;
      --secondary: #f1f6ff;
      --secondary-foreground: #0840a8;
      --muted: #f3f4f6;
      --muted-foreground: #94a3b8;
      --success: #22c55e;
      --success-foreground: #ffffff;
      --accent: #ffd166;
      --accent-foreground: #222222;
      --destructive: #ef4444;
      --destructive-foreground: #ffffff;
      --warning: #f59e0b;
      --warning-foreground: #111827;
      --card: #ffffff;
      --card-foreground: #0f1724;
      --sidebar: #f8fafb;
      --sidebar-foreground: #0b1220;
      --sidebar-primary: #e6f0ff;
      --sidebar-primary-foreground: #003eaa;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --font-family-body: Inter;
    }
  </style>
</div>
